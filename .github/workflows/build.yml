name: Build Electron Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: win
            pattern: |
              dist/*.exe
              dist/*.blockmap
          - os: macos-latest
            artifact: mac
            pattern: |
              dist/*.dmg
              dist/*.zip
          - os: ubuntu-latest
            artifact: linux
            pattern: |
              dist/*.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set mirrors (China-friendly)
        shell: bash
        run: |
          echo "ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/" >> $GITHUB_ENV
          echo "ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/" >> $GITHUB_ENV

      - name: Validate icons
        shell: bash
        run: |
          node -e "const fs=require('fs');const buf=fs.readFileSync('build/icon.png');if(buf.slice(1,4).toString()!=='PNG'){console.error('build/icon.png 不是有效 PNG');process.exit(1);}const w=buf.readUInt32BE(16),h=buf.readUInt32BE(20);if(w<512||h<512){console.error('build/icon.png 尺寸 '+w+'x'+h+'，macOS 要求 >=512x512');process.exit(1);}console.log('OK build/icon.png '+w+'x'+h);"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          npm pkg set version="$VERSION"
          echo "package.json version -> $(node -p "require('./package.json').version")"

      - name: Build installer
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sharebox-${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: warn
          retention-days: 30
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.AppImage
          generate_release_notes: true
          draft: false
          prerelease: false