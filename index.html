<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co https://*.supabase.in; font-src 'self' data:; connect-src 'self' https://*.supabase.co https://*.supabase.in wss://*.supabase.co wss://*.supabase.in; media-src 'self' blob: https://*.supabase.co https://*.supabase.in; frame-src 'self' https://*.supabase.co https://*.supabase.in https://view.officeapps.live.com; object-src 'none'; base-uri 'self'; form-action 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2980b9">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/chat.css">
    <link rel="stylesheet" href="./css/explorer.css">
    <link rel="stylesheet" href="./css/viewer.css">
    <link rel="stylesheet" href="./css/dialog.css">
    <link rel="stylesheet" href="./css/menu.css">
    <link rel="stylesheet" href="./css/share.css">
    <link rel="stylesheet" href="./css/dark.css">
    <link rel="icon" type="image/x-icon" href="./assets/icon.ico">
    <link rel="apple-touch-icon" href="./assets/icon.ico">
    <title>ShareBox</title>
</head>

<body>
    <div class="top-bar">
        <h2>ShareBox</h2>
        <div class="top-actions">
            <button id="notifyToggle" class="theme-toggle" type="button">🔔 通知</button>
            <button id="themeToggle" class="theme-toggle" type="button">🌙 深色</button>
        </div>
    </div>

    <!-- 标签栏 -->
    <div class="tabs">
        <button class="tab active" data-tab="chat" type="button">💬 公共聊天室</button>
        <button class="tab" data-tab="netdisk" type="button">📁 公共网盘</button>
    </div>

    <main>
        <!-- 聊天室面板 -->
        <div id="tab-chat" class="tab-panel active">
            <div class="card">
                <div class="chat-header">
                    <h3>公共聊天室</h3>
                    <button class="nav-btn" id="btnChatRefresh" type="button" title="刷新">⟳</button>
                </div>
                <div class="chat-body">
                    <div id="msgBox"></div>
                    <div class="chat-input-row">
                        <input id="userName" placeholder="昵称" value="匿名用户">
                        <div class="md-toolbar" id="mdToolbar">
                            <button type="button" class="md-btn" data-md="bold" title="加粗 (Ctrl+B)"><b>B</b></button>
                            <button type="button" class="md-btn" data-md="italic" title="斜体 (Ctrl+I)"><i>I</i></button>
                            <button type="button" class="md-btn" data-md="strike" title="删除线"><s>S</s></button>
                            <span class="md-sep"></span>
                            <button type="button" class="md-btn" data-md="h" title="标题">H</button>
                            <button type="button" class="md-btn" data-md="quote" title="引用">&gt;</button>
                            <button type="button" class="md-btn" data-md="ul" title="无序列表">•</button>
                            <button type="button" class="md-btn" data-md="ol" title="有序列表">1.</button>
                            <span class="md-sep"></span>
                            <button type="button" class="md-btn" data-md="code" title="行内代码">&lt;/&gt;</button>
                            <button type="button" class="md-btn" data-md="codeblock" title="代码块">{ }</button>
                            <span class="md-sep"></span>
                            <button type="button" class="md-btn" data-md="link" title="链接 (Ctrl+K)">🔗</button>
                            <button type="button" class="md-btn" data-md="image" title="图片">🖼️</button>
                        </div>
                        <div class="msg-input-wrap">
                            <textarea id="msgInput" placeholder="输入消息（Enter 发送，Shift+Enter 换行）"></textarea>
                            <div class="md-hint" id="mdHint"></div>
                        </div>
                        <div class="chat-input-actions">
                            <button type="button" class="share-btn" id="btnShareFile" title="分享文件">📎</button>
                            <button type="button" class="send-btn" onclick="sendMsg()">发送</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 网盘面板 -->
        <div id="tab-netdisk" class="tab-panel">
            <div class="card">
                <!-- 文件夹标签页栏 -->
                <div class="folder-tabs" id="folderTabs"></div>

                <!-- 资源管理器工具栏 -->
                <div class="explorer-toolbar">
                    <button class="nav-btn" id="btnUp" type="button" title="上一级">↑ 上一级</button>
                    <div id="breadcrumb"></div>
                    <div class="toolbar-actions">
                        <div class="upload-menu-wrap">
                            <button class="nav-btn" id="btnUpload" type="button" title="上传">📤 上传</button>
                            <div class="upload-menu" id="uploadMenu">
                                <div class="upload-menu-item" data-upload="file">📄 选择文件</div>
                                <div class="upload-menu-item" data-upload="folder">📂 选择文件夹</div>
                            </div>
                        </div>
                        <button class="nav-btn" id="btnRefresh" type="button" title="刷新">⟳</button>
                    </div>
                </div>

                <!-- 搜索框 -->
                <div class="search-bar">
                    <input type="search" id="searchInput" placeholder="🔍 搜索文件名或路径…" autocomplete="off">
                    <button type="button" id="searchClear" class="search-clear" title="清空">×</button>
                </div>

                <!-- 文件列表 + 底部进度条 -->
                <div class="file-list-wrap" id="fileListWrap">
                    <div id="fileList"></div>
                    <div class="status-bar">
                        <div id="progress" class="progress-inner">
                            <progress id="uploadProgress" value="0" max="100"></progress>
                            <span id="uploadTip"></span>
                        </div>
                        <div class="status-items" id="statusItems">
                            <span class="status-item" id="statusSelected" style="display:none"></span>
                            <span class="status-item" id="statusClipboard" style="display:none"></span>
                        </div>
                        <div class="storage-info" id="storageInfo" title="存储空间">
                            <div class="storage-bar">
                                <div class="storage-bar-fill" id="storageBarFill"></div>
                            </div>
                            <span class="storage-text" id="storageText">— / —</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <!-- 通用弹窗 -->
    <div id="dialog" class="dialog-overlay">
        <div class="dialog-box">
            <div class="dialog-title" id="dialogTitle"></div>
            <div class="dialog-message" id="dialogMessage"></div>
            <input type="text" id="dialogInput" class="dialog-input" style="display:none">
            <div class="dialog-actions">
                <button class="dialog-btn" id="dialogCancel" type="button">取消</button>
                <button class="dialog-btn primary" id="dialogOk" type="button">确定</button>
            </div>
        </div>
    </div>
    <!-- 新建文件弹窗 -->
    <div id="newFileDialog" class="dialog-overlay">
        <div class="dialog-box new-file-box">
            <div class="dialog-title">新建文件</div>
            <input type="text" id="newFileName" class="dialog-input" placeholder="文件名（含扩展名）">
            <textarea id="newFileContent" class="dialog-textarea" placeholder="文件内容（可选）"></textarea>
            <div class="dialog-actions">
                <button class="dialog-btn" id="newFileCancel" type="button">取消</button>
                <button class="dialog-btn primary" id="newFileOk" type="button">创建</button>
            </div>
        </div>
    </div>
    <!-- 分享文件弹窗 -->
    <div id="shareDialog" class="dialog-overlay">
        <div class="dialog-box share-box">
            <div class="dialog-title">分享文件</div>
            <div class="dialog-message">输入链接，或上传文件到网盘</div>
            <input type="text" id="shareUrlInput" class="dialog-input" placeholder="https://... 或上传后自动填入">
            <button type="button" id="shareUploadBtn" class="dialog-btn upload-btn">
                📤 选择文件上传到 /文件 目录
            </button>
            <div id="shareUploadStatus" class="share-upload-status"></div>
            <div class="dialog-actions">
                <button class="dialog-btn" id="shareCancel" type="button">取消</button>
                <button class="dialog-btn primary" id="shareOk" type="button">分享</button>
            </div>
        </div>
    </div>
    <!-- 打开方式弹窗 -->
    <div id="openWithDialog" class="dialog-overlay">
        <div class="dialog-box open-with-box">
            <div class="dialog-title" id="openWithTitle">打开方式</div>
            <div class="dialog-message" id="openWithMessage"></div>
            <div class="open-with-list" id="openWithList"></div>
            <div class="dialog-actions">
                <button class="dialog-btn" id="openWithCancel" type="button">取消</button>
            </div>
        </div>
    </div>
    <!-- 属性对话框 -->
    <div id="propertiesDialog" class="dialog-overlay">
        <div class="dialog-box prop-box">
            <div class="prop-header">
                <div class="prop-icon" id="propIcon"></div>
                <div class="prop-title" id="propTitle"></div>
            </div>
            <div class="prop-table" id="propTable"></div>
            <div class="dialog-actions">
                <button class="dialog-btn primary" id="propOk" type="button">确定</button>
            </div>
        </div>
    </div>

    <!-- 文本查看器 -->
    <div id="textViewer" class="viewer-overlay">
        <div class="viewer-box">
            <div class="viewer-header">
                <span class="viewer-title" id="viewerTitle">文件预览</span>
                <div class="viewer-actions">
                    <button class="fe-btn" id="viewerShare" type="button">分享</button>
                    <button class="fe-btn" id="viewerCopy" type="button">复制</button>
                    <button class="fe-btn" id="viewerDownload" type="button">下载</button>
                    <button class="fe-btn del" id="viewerClose" type="button">关闭</button>
                </div>
            </div>
            <div class="viewer-content" id="viewerContent"></div>
        </div>
    </div>
    <!-- 代码高亮 -->
    <link id="hljsLight" rel="stylesheet" media="all" href="./assets/lib/github.min.css">
    <link id="hljsDark" rel="stylesheet" media="not all" href="./assets/lib/github-dark.min.css">
    <script src="./assets/lib/highlight.min.js"></script>
    <script src="./assets/lib/jszip.min.js"></script>
    <script src="./assets/lib/marked.min.js"></script>
    <script src="./assets/lib/supabase-js.js"></script>

    <!-- 应用代码（顺序不能变） -->
    <script src="./env.js"></script>
    <script src="./js/config.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/dialog.js"></script>
    <script src="./js/preview.js"></script>
    <script src="./js/share.js"></script>
    <script src="./js/favorites.js"></script>
    <script src="./js/chat.js"></script>
    <script src="./js/upload.js"></script>
    <script src="./js/explorer.js"></script>
    <script src="./js/actions.js"></script>
    <script src="./js/context-menus.js"></script>
    <script src="./js/tabs.js"></script>
    <script src="./js/main.js"></script>
</body>

</html>
