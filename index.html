<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2980b9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/chat.css">
    <link rel="stylesheet" href="./css/explorer.css">
    <link rel="stylesheet" href="./css/viewer.css">
    <link rel="stylesheet" href="./css/dialog.css">
    <link rel="stylesheet" href="./css/menu.css">
    <link rel="stylesheet" href="./css/dark.css">
    <link rel="icon" type="image/png" href="./build/icon.png">
    <link rel="alternate icon" type="image/x-icon" href="./build/icon.ico">
    <link rel="apple-touch-icon" href="./build/icon.png">
    <title>ShareBox</title>
</head>

<body>
    <div class="top-bar">
        <h2>ShareBox</h2>
        <div class="top-actions">
            <button id="notifyToggle" class="theme-toggle" type="button">🔔 通知</button>
            <button id="themeToggle" class="theme-toggle" type="button">🌙 深色</button>
        </div>
    </div>

    <!-- 标签栏 -->
    <div class="tabs">
        <button class="tab active" data-tab="chat" type="button">💬 公共聊天室</button>
        <button class="tab" data-tab="netdisk" type="button">📁 公共网盘</button>
    </div>

    <main>
        <!-- 聊天室面板 -->
        <div id="tab-chat" class="tab-panel active">
            <div class="card">
                <div class="chat-header">
                    <h3>公共聊天室</h3>
                    <button class="nav-btn" id="btnChatRefresh" type="button" title="刷新">⟳</button>
                </div>
                <div id="msgBox"></div>
                <div class="chat-input-row">
                    <input id="userName" placeholder="昵称" value="匿名用户">
                    <input id="msgInput" placeholder="输入消息">
                    <button onclick="sendMsg()" type="button">发送</button>
                </div>
            </div>
        </div>

        <!-- 网盘面板 -->
        <div id="tab-netdisk" class="tab-panel">
            <div class="card">
                <!-- 文件夹标签页栏 -->
                <div class="folder-tabs" id="folderTabs"></div>

                <!-- 资源管理器工具栏 -->
                <div class="explorer-toolbar">
                    <button class="nav-btn" id="btnUp" type="button" title="上一级">↑ 上一级</button>
                    <div id="breadcrumb"></div>
                    <div class="toolbar-actions">
                        <div class="upload-menu-wrap">
                            <button class="nav-btn" id="btnUpload" type="button" title="上传">📤 上传</button>
                            <div class="upload-menu" id="uploadMenu">
                                <div class="upload-menu-item" data-upload="file">📄 选择文件</div>
                                <div class="upload-menu-item" data-upload="folder">📂 选择文件夹</div>
                            </div>
                        </div>
                        <button class="nav-btn" id="btnRefresh" type="button" title="刷新">⟳</button>
                    </div>
                </div>

                <!-- 搜索框 -->
                <div class="search-bar">
                    <input type="search" id="searchInput" placeholder="🔍 搜索文件名或路径…" autocomplete="off">
                    <button type="button" id="searchClear" class="search-clear" title="清空">×</button>
                </div>

                <!-- 文件列表 + 底部进度条 -->
                <div class="file-list-wrap" id="fileListWrap">
                    <div id="fileList"></div>
                    <div id="progress" class="progress-bottom">
                        <progress id="uploadProgress" value="0" max="100"></progress>
                        <span id="uploadTip"></span>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <!-- 通用弹窗 -->
    <div id="dialog" class="dialog-overlay">
        <div class="dialog-box">
            <div class="dialog-title" id="dialogTitle"></div>
            <div class="dialog-message" id="dialogMessage"></div>
            <input type="text" id="dialogInput" class="dialog-input" style="display:none">
            <div class="dialog-actions">
                <button class="dialog-btn" id="dialogCancel" type="button">取消</button>
                <button class="dialog-btn primary" id="dialogOk" type="button">确定</button>
            </div>
        </div>
    </div>
    <!-- 新建文件弹窗 -->
    <div id="newFileDialog" class="dialog-overlay">
        <div class="dialog-box new-file-box">
            <div class="dialog-title">新建文件</div>
            <input type="text" id="newFileName" class="dialog-input" placeholder="文件名（含扩展名）">
            <textarea id="newFileContent" class="dialog-textarea" placeholder="文件内容（可选）"></textarea>
            <div class="dialog-actions">
                <button class="dialog-btn" id="newFileCancel" type="button">取消</button>
                <button class="dialog-btn primary" id="newFileOk" type="button">创建</button>
            </div>
        </div>
    </div>

    <!-- 打开方式弹窗 -->
    <div id="openWithDialog" class="dialog-overlay">
        <div class="dialog-box open-with-box">
            <div class="dialog-title" id="openWithTitle">打开方式</div>
            <div class="dialog-message" id="openWithMessage"></div>
            <div class="open-with-list" id="openWithList"></div>
            <div class="dialog-actions">
                <button class="dialog-btn" id="openWithCancel" type="button">取消</button>
            </div>
        </div>
    </div>
    <!-- 文本查看器 -->
    <div id="textViewer" class="viewer-overlay">
        <div class="viewer-box">
            <div class="viewer-header">
                <span class="viewer-title" id="viewerTitle">文件预览</span>
                <div class="viewer-actions">
                    <button class="fe-btn" id="viewerCopy" type="button">复制</button>
                    <button class="fe-btn" id="viewerDownload" type="button">下载</button>
                    <button class="fe-btn del" id="viewerClose" type="button">关闭</button>
                </div>
            </div>
            <div class="viewer-content" id="viewerContent"></div>
        </div>
    </div>
    <!-- 代码高亮 -->
    <link id="hljsLight" rel="stylesheet" media="all"
        href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
    <link id="hljsDark" rel="stylesheet" media="not all"
        href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 应用代码（顺序不能变） -->
    <script src="./js/config.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/dialog.js"></script>
    <script src="./js/preview.js"></script>
    <script src="./js/chat.js"></script>
    <script src="./js/upload.js"></script>
    <script src="./js/explorer.js"></script>
    <script src="./js/actions.js"></script>
    <script src="./js/tabs.js"></script>
    <script src="./js/main.js"></script>
</body>

</html>
