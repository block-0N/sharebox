<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>ShareBox</title>
</head>

<body>
    <h2>ShareBox</h2>
    <main>
        <!-- 聊天区域 -->
        <div class="card">
            <h3>公共聊天室</h3>
            <div id="msgBox"></div>
            <div>
                <input id="userName" placeholder="昵称" value="匿名用户">
                <input id="msgInput" placeholder="输入消息">
                <button onclick="sendMsg()" type="button">发送</button>
            </div>
        </div>
        <!-- 网盘区域 -->
        <div class="card">
            <h3>公共网盘</h3>
            <!-- 新增HTML区域：拖拽框 + 进度条 + 原有上传输入 -->
            <div id="dropArea">
                将文件/文件夹拖拽到此处上传
            </div>
            <div id="progress">
                <progress id="uploadProgress" value="0" max="100"></progress>
                <span id="uploadTip"></span>
            </div>
            <div class="file">
                <input type="file" id="fileInput" title="选择文件" onchange="uploadFile()" multiple hidden>
                <label for="fileInput">📄 选择多个文件</label>
                <span id="fileTip">未选择文件</span>
            </div>
            <div class="file">
                <input type="file" id="folderInput" title="选择文件夹" webkitdirectory multiple onchange="uploadFolder()"
                    hidden>
                <label for="folderInput">📂 选择文件夹</label>
                <span id="folderTip">未选择文件夹</span>
            </div>
            <div id="fileList"></div>
        </div>
    </main>
    <script src="https://cdn.bootcdn.net/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./auth.js"></script>
</body>

</html>
