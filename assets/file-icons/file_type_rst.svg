<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 纸张渐变：深蓝绿到青绿 -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F6F78"/>
      <stop offset="100%" stop-color="#2A9D8F"/>
    </linearGradient>
    <!-- 轻微阴影，增加立体感 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 纸张主体：带右上折角的圆角文档 -->
  <path d="M 32 24 
           Q 24 24 24 32 
           L 24 104 
           Q 24 112 32 112 
           L 96 112 
           Q 104 112 104 104 
           L 104 48 
           L 80 24 
           L 32 24 Z" 
        fill="url(#paperGrad)" filter="url(#shadow)"/>

  <!-- 右上角折角 -->
  <path d="M 80 24 L 104 48 L 80 48 Z" fill="#FFFFFF" fill-opacity="0.25"/>

  <!-- 中央文字 RST -->
  <text x="64" y="78" 
        font-family="Arial, Helvetica, sans-serif" 
        font-weight="bold" 
        font-size="34" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        letter-spacing="1">RST</text>

  <!-- 右下角 reStructuredText 特征符号 :: -->
  <text x="92" y="102" 
        font-family="Arial, Helvetica, sans-serif" 
        font-weight="bold" 
        font-size="20" 
        fill="#FFFFFF" 
        fill-opacity="0.7" 
        text-anchor="middle">::</text>
</svg>